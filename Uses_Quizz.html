        <link href="styles.css" rel="stylesheet">
        <title>Uses_Quiz</title>
        <script>
            function multicheck(event) {
                let button = event.target;

                if (button.innerHTML == '200 rats in a bunker though with your party with them too') {
                    button.style.backgroundColor = 'Green';
                    button.parentElement.querySelector('.feedback').innerHTML = 'Correct!';
                }
                else {
                    button.style.backgroundColor = 'Red';
                    button.parentElement.querySelector('.feedback').innerHTML = 'Incorrect';
                }
            }
            </script>
    </head>
    <body>
        <h1 class="center-text">Multiple Choice Quizz</h1>
        <hr>
        <h3 class="center-text">What is the best use of Fireball</p>
            <button onclick="multicheck(event)">One Really big guy</button>
            <hr>
                <button onclick="multicheck(event)">30 Goblins in a tight space</button>
                <hr>
                <button onclick="multicheck(event)">30 Goblins spread around</button>
                <hr>

                <hr>
